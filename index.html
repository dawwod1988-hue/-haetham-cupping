<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>هيثم للحجامة</title>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f5f7f9;
      color:#222;
    }

    .container{
      max-width:700px;
      margin:auto;
      padding:20px;
    }

    .header{
      background:#111827;
      color:white;
      padding:25px 20px;
      border-radius:18px;
      text-align:center;
      margin-bottom:20px;
    }

    .header h1{
      margin:0 0 8px;
      font-size:28px;
    }

    .header p{
      margin:5px 0;
      opacity:.9;
    }

    .card{
      background:white;
      border-radius:18px;
      padding:20px;
      margin-bottom:18px;
      box-shadow:0 4px 15px rgba(0,0,0,.06);
    }

    h2{
      margin-top:0;
      font-size:21px;
    }

    label{
      display:block;
      margin:15px 0 7px;
      font-weight:bold;
    }

    input,
    textarea{
      width:100%;
      padding:13px;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:16px;
      direction:rtl;
      background:white;
    }

    textarea{
      min-height:90px;
      resize:vertical;
    }

    .dates,
    .times{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    button{
      font-family:inherit;
      cursor:pointer;
    }

    .date-btn,
    .time-btn{
      border:1px solid #ddd;
      background:#fff;
      padding:12px 6px;
      border-radius:10px;
      font-size:14px;
    }

    .date-btn.selected,
    .time-btn.selected{
      background:#111827;
      color:white;
      border-color:#111827;
    }

    .time-btn.full{
      background:#eee;
      color:#999;
      cursor:not-allowed;
    }

    .btn{
      width:100%;
      border:0;
      border-radius:12px;
      padding:15px;
      font-size:17px;
      font-weight:bold;
      margin-top:15px;
    }

    .btn-primary{
      background:#111827;
      color:white;
    }

    .message{
      padding:13px;
      border-radius:10px;
      margin-bottom:15px;
      display:none;
      text-align:center;
      word-break:break-word;
    }

    .message.info{
      display:block;
      background:#e8f1ff;
      color:#174ea6;
    }

    .message.success{
      display:block;
      background:#e7f7ed;
      color:#137333;
    }

    .message.error{
      display:block;
      background:#fdeaea;
      color:#b3261e;
      direction:ltr;
      text-align:left;
    }

    .empty{
      color:#777;
      text-align:center;
      padding:15px;
    }

    .whatsapp{
      display:block;
      text-align:center;
      text-decoration:none;
      color:#128c7e;
      font-weight:bold;
      margin-top:15px;
    }

    .small{
      font-size:13px;
      color:#777;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="header">

    <h1 id="centerName">
      هيثم للحجامة
    </h1>

    <p id="centerArea">
      أبو سنان
    </p>

  </div>


  <div
    id="message"
    class="message"
  ></div>


  <div class="card">

    <h2>
      حجز موعد
    </h2>


    <label>
      اختر التاريخ
    </label>

    <div
      id="dates"
      class="dates"
    ></div>


    <label>
      اختر الوقت
    </label>

    <div
      id="times"
      class="times"
    >

      <div class="empty">
        اختر التاريخ أولاً
      </div>

    </div>

  </div>


  <div class="card">

    <h2>
      بيانات الحجز
    </h2>


    <label for="customerName">
      الاسم
    </label>

    <input
      id="customerName"
      type="text"
      placeholder="اكتب اسمك"
      autocomplete="name"
    >


    <label for="customerPhone">
      رقم الهاتف
    </label>

    <input
      id="customerPhone"
      type="tel"
      placeholder="05XXXXXXXX"
      autocomplete="tel"
    >


    <label for="customerNotes">
      ملاحظات
    </label>

    <textarea
      id="customerNotes"
      placeholder="أي ملاحظات إضافية..."
    ></textarea>


    <button
      class="btn btn-primary"
      onclick="createBooking()"
      type="button"
    >
      إرسال طلب الحجز
    </button>

  </div>


  <a
    id="whatsappLink"
    class="whatsapp"
    href="#"
    target="_blank"
  >
    التواصل عبر واتساب
  </a>


  <p
    class="small"
    style="text-align:center;margin-top:20px;"
  >
    سيتم تأكيد الموعد بعد مراجعة طلب الحجز.
  </p>

</div>



<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>


/* =========================
   Firebase Configuration
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyClhrm3BtsQhOOUe_Am9z69DkRAEwsweJ4",

  authDomain:
    "haetham-80b2a.firebaseapp.com",

  projectId:
    "haetham-80b2a",

  storageBucket:
    "haetham-80b2a.firebasestorage.app",

  messagingSenderId:
    "288982607003",

  appId:
    "1:288982607003:web:841f87f604b80b5745d23e",

  measurementId:
    "G-SSQSPWN5EX"

};


firebase.initializeApp(
  firebaseConfig
);


const db =
  firebase.firestore();


/*
  تحسين اتصال Firestore
  مع iPhone / Safari
*/

db.settings({

  experimentalForceLongPolling: true,

  useFetchStreams: false

});


const auth =
  firebase.auth();



/* =========================
   App State
========================= */

const S = {

  settings: {

    name:
      "هيثم للحجامة",

    area:
      "أبو سنان",

    whatsapp:
      "",

    start:
      "10:00",

    end:
      "22:00",

    slot:
      60,

    capacity:
      2,

    daysOff:
      []

  },

  availability:
    {},

  selectedDate:
    "",

  selectedTime:
    ""

};



/* =========================
   Messages
========================= */

function message(text,type){

  const el =
    document.getElementById(
      "message"
    );

  if(!el){
    return;
  }

  el.className =
    "message " + type;

  el.textContent =
    text;

}



/* =========================
   Convert Arabic Numbers
========================= */

function toEn(value){

  if(!value){
    return "";
  }

  return value

    .replace(
      /[٠-٩]/g,
      function(d){

        return "٠١٢٣٤٥٦٧٨٩".indexOf(d);

      }
    )

    .replace(
      /[۰-۹]/g,
      function(d){

        return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);

      }
    );

}



/* =========================
   WhatsApp Number
========================= */

function waNum(p){

  let d =
    toEn(p).replace(/\D/g,'');


  if(
    d.startsWith("00")
  ){

    d =
      d.slice(2);

  }


  if(
    /^0\d{8,9}$/.test(d)
  ){

    d =
      "972" + d.slice(1);

  }


  if(
    /^9720\d{8,9}$/.test(d)
  ){

    d =
      "972" + d.slice(4);

  }


  return d;

}



/* =========================
   Today's Date
========================= */

function todayString(){

  const d =
    new Date();


  const y =
    d.getFullYear();


  const m =
    String(
      d.getMonth()+1
    ).padStart(2,"0");


  const day =
    String(
      d.getDate()
    ).padStart(2,"0");


  return (
    y + "-" +
    m + "-" +
    day
  );

}



/* =========================
   Add Days
========================= */

function addDays(
  dateString,
  days
){

  const d =
    new Date(
      dateString +
      "T00:00:00"
    );


  d.setDate(
    d.getDate() + days
  );


  const y =
    d.getFullYear();


  const m =
    String(
      d.getMonth()+1
    ).padStart(2,"0");


  const day =
    String(
      d.getDate()
    ).padStart(2,"0");


  return (
    y + "-" +
    m + "-" +
    day
  );

}



/* =========================
   Day Name
========================= */

function dayName(dateString){

  const d =
    new Date(
      dateString +
      "T00:00:00"
    );


  const names = [

    "الأحد",
    "الإثنين",
    "الثلاثاء",
    "الأربعاء",
    "الخميس",
    "الجمعة",
    "السبت"

  ];


  return names[
    d.getDay()
  ];

}



/* =========================
   Short Date
========================= */

function shortDate(dateString){

  const parts =
    dateString.split("-");


  return (
    parts[2] +
    "/" +
    parts[1]
  );

}



/* =========================
   Day Off
========================= */

function isDayOff(date){

  return (

    Array.isArray(
      S.settings.daysOff
    )

    &&

    S.settings.daysOff.includes(
      date
    )

  );

}



/* =========================
   Taken Slots
========================= */

function taken(
  date,
  time
){

  const key =
    date + "_" + time;


  if(
    S.availability &&
    S.availability[key]
  ){

    return (
      Number(
        S.availability[key]
      ) || 0
    );

  }


  return 0;

}



/* =========================
   Full Slot
========================= */

function full(
  date,
  time
){

  return (

    taken(
      date,
      time
    )

    >=

    Number(
      S.settings.capacity || 2
    )

  );

}



/* =========================
   Create Time Slots
========================= */

function makeTimes(){

  const result = [];


  const start =
    S.settings.start ||
    "10:00";


  const end =
    S.settings.end ||
    "22:00";


  const slot =
    Number(
      S.settings.slot || 60
    );


  let [sh,sm] =
    start
      .split(":")
      .map(Number);


  let [eh,em] =
    end
      .split(":")
      .map(Number);


  let current =
    sh * 60 + sm;


  const finish =
    eh * 60 + em;


  while(
    current < finish
  ){

    const h =
      Math.floor(
        current / 60
      );


    const m =
      current % 60;


    result.push(

      String(h).padStart(
        2,
        "0"
      )

      +

      ":"

      +

      String(m).padStart(
        2,
        "0"
      )

    );


    current += slot;

  }


  return result;

}



/* =========================
   Render Dates
========================= */

function renderDates(){

  const el =
    document.getElementById(
      "dates"
    );


  if(!el){
    return;
  }


  el.innerHTML =
    "";


  const start =
    todayString();


  for(
    let i=0;
    i<21;
    i++
  ){

    const date =
      addDays(
        start,
        i
      );


    const button =
      document.createElement(
        "button"
      );


    button.type =
      "button";


    button.className =
      "date-btn";


    if(
      S.selectedDate === date
    ){

      button.classList.add(
        "selected"
      );

    }


    button.innerHTML =

      "<strong>" +

      dayName(date) +

      "</strong><br>" +

      shortDate(date);


    button.onclick =
      function(){

        selectDate(date);

      };


    el.appendChild(
      button
    );

  }

}



/* =========================
   Select Date
========================= */

function selectDate(date){

  S.selectedDate =
    date;


  S.selectedTime =
    "";


  renderDates();

  renderTimes();

}



/* =========================
   Render Times
========================= */

function renderTimes(){

  const el =
    document.getElementById(
      "times"
    );


  if(!el){
    return;
  }


  el.innerHTML =
    "";


  if(!S.selectedDate){

    el.innerHTML =
      '<div class="empty">اختر التاريخ أولاً</div>';

    return;

  }


  if(
    isDayOff(
      S.selectedDate
    )
  ){

    el.innerHTML =
      '<div class="empty">هذا اليوم غير متاح للحجز</div>';

    return;

  }


  const times =
    makeTimes();


  if(
    times.length === 0
  ){

    el.innerHTML =
      '<div class="empty">لا توجد أوقات متاحة</div>';

    return;

  }


  times.forEach(
    function(time){

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "time-btn";


      const isFull =
        full(
          S.selectedDate,
          time
        );


      if(isFull){

        button.classList.add(
          "full"
        );


        button.disabled =
          true;


        button.textContent =
          time +
          " ممتلئ";

      }

      else{

        button.textContent =
          time;


        if(
          S.selectedTime === time
        ){

          button.classList.add(
            "selected"
          );

        }


        button.onclick =
          function(){

            selectTime(time);

          };

      }


      el.appendChild(
        button
      );

    }
  );

}



/* =========================
   Select Time
========================= */

function selectTime(time){

  S.selectedTime =
    time;


  renderTimes();

}



/* =========================
   Render Home
========================= */

function renderHome(){

  const name =
    document.getElementById(
      "centerName"
    );


  const area =
    document.getElementById(
      "centerArea"
    );


  if(name){

    name.textContent =
      S.settings.name ||
      "هيثم للحجامة";

  }


  if(area){

    area.textContent =
      S.settings.area ||
      "أبو سنان";

  }


  const wa =
    waNum(
      S.settings.whatsapp
    );


  const link =
    document.getElementById(
      "whatsappLink"
    );


  if(link){

    if(wa){

      link.href =
        "https://wa.me/" +
        wa;

    }

    else{

      link.href =
        "#";

    }

  }


  renderDates();

  renderTimes();

}



/* ==================================================
   CREATE BOOKING
================================================== */

async function createBooking(){

  message(
    "جاري إرسال الحجز...",
    "info"
  );


  const nameEl =
    document.getElementById(
      "customerName"
    );


  const phoneEl =
    document.getElementById(
      "customerPhone"
    );


  const notesEl =
    document.getElementById(
      "customerNotes"
    );


  if(
    !nameEl ||
    !phoneEl
  ){

    message(
      "تعذر قراءة بيانات الحجز",
      "error"
    );

    return;

  }


  const name =
    nameEl.value.trim();


  const phone =
    phoneEl.value.trim();


  const notes =
    notesEl
      ? notesEl.value.trim()
      : "";


  if(!name){

    message(
      "يرجى كتابة الاسم",
      "error"
    );

    return;

  }


  if(
    name.length < 2
  ){

    message(
      "الاسم قصير جدًا",
      "error"
    );

    return;

  }


  if(!phone){

    message(
      "يرجى كتابة رقم الهاتف",
      "error"
    );

    return;

  }


  if(
    phone.length < 6
  ){

    message(
      "يرجى إدخال رقم هاتف صحيح",
      "error"
    );

    return;

  }


  if(
    !S.selectedDate
  ){

    message(
      "يرجى اختيار التاريخ",
      "error"
    );

    return;

  }


  if(
    !S.selectedTime
  ){

    message(
      "يرجى اختيار الوقت",
      "error"
    );

    return;

  }


  if(
    isDayOff(
      S.selectedDate
    )
  ){

    message(
      "هذا اليوم غير متاح للحجز",
      "error"
    );

    return;

  }


  if(
    full(
      S.selectedDate,
      S.selectedTime
    )
  ){

    message(
      "عذرًا، هذا الموعد أصبح ممتلئًا",
      "error"
    );

    return;

  }


  try{

    const bookingData = {

      name:
        name,

      phone:
        phone,

      date:
        S.selectedDate,

      time:
        S.selectedTime,

      notes:
        notes,

      status:
        "pending",

      createdAt:
        Date.now()

    };


    console.log(
      "BOOKING DATA:",
      bookingData
    );


    await db
      .collection("bookings")
      .add(
        bookingData
      );


    console.log(
      "BOOKING SAVED"
    );


    S.selectedTime =
      "";


    renderHome();


    message(
      "تم إرسال طلب الحجز بنجاح ✅",
      "success"
    );


  }

  catch(error){

    console.error(
      "CREATE BOOKING ERROR:",
      error
    );


    message(

      "خطأ Firebase: " +

      (
        error.message ||
        error.code ||
        "خطأ غير معروف"
      ),

      "error"

    );

  }

}



/* =========================
   Firebase Settings
========================= */

db
  .collection("settings")
  .doc("main")
  .onSnapshot(

    function(doc){

      if(
        doc.exists
      ){

        const data =
          doc.data();


        S.settings = {

          ...S.settings,

          ...data

        };

      }


      /*
        لا نعيد بناء الصفحة أثناء
        إدخال بيانات الحجز إذا كان
        المستخدم قد اختار وقتًا.
      */

      if(
        !S.selectedTime
      ){

        renderHome();

      }

    },


    function(error){

      console.error(
        "SETTINGS ERROR:",
        error
      );

    }

  );



/* =========================
   Firebase Availability
========================= */

db
  .collection("settings")
  .doc("availability")
  .onSnapshot(

    function(doc){

      if(
        doc.exists
      ){

        S.availability =
          doc.data() || {};

      }

      else{

        S.availability =
          {};

      }


      if(
        S.selectedDate &&
        !S.selectedTime
      ){

        renderTimes();

      }

    },


    function(error){

      console.error(
        "AVAILABILITY ERROR:",
        error
      );

    }

  );



/* =========================
   Start App
========================= */

renderHome();


</script>

</body>
</html>
