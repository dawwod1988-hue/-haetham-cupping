<!doctype html>
<html lang="ar" dir="rtl">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>هيثم للحجامة – أبو سنان</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f4f6f8;
  color:#1f2937;
}

button,input,textarea,select{
  font-family:inherit;
}

.container{
  max-width:700px;
  margin:auto;
  padding:16px;
}

.header{
  background:#111827;
  color:white;
  border-radius:20px;
  padding:24px 18px;
  margin-bottom:16px;
  text-align:center;
}

.header h1{
  margin:0 0 8px;
  font-size:27px;
}

.header p{
  margin:0;
  opacity:.85;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.card h2{
  margin:0 0 15px;
  font-size:20px;
}

.small{
  color:#6b7280;
  font-size:14px;
}

.date-list{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:5px;
}

.date-item{
  min-width:72px;
  padding:10px 6px;
  border:1px solid #e5e7eb;
  border-radius:14px;
  text-align:center;
  cursor:pointer;
  background:white;
}

.date-item.active{
  background:#111827;
  color:white;
  border-color:#111827;
}

.date-day{
  font-size:12px;
  margin-bottom:4px;
}

.date-number{
  font-size:22px;
  font-weight:bold;
}

.time-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.time-btn{
  border:1px solid #d1d5db;
  background:white;
  border-radius:12px;
  padding:12px 5px;
  font-size:16px;
  cursor:pointer;
}

.time-btn.active{
  background:#111827;
  color:white;
}

.time-btn.disabled{
  background:#e5e7eb;
  color:#9ca3af;
  cursor:not-allowed;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:12px;
  padding:12px;
  font-size:16px;
  background:white;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:6px;
}

.btn-primary{
  background:#111827;
  color:white;
}

.btn-success{
  background:#16a34a;
  color:white;
}

.btn-secondary{
  background:#e5e7eb;
  color:#111827;
}

.btn-danger{
  background:#dc2626;
  color:white;
}

.btn-warning{
  background:#f59e0b;
  color:white;
}

.empty{
  text-align:center;
  padding:25px;
  color:#6b7280;
}

.message{
  position:fixed;
  left:15px;
  right:15px;
  bottom:20px;
  z-index:9999;
  padding:15px;
  border-radius:14px;
  text-align:center;
  color:white;
  font-weight:bold;
  display:none;
}

.message.show{
  display:block;
}

.message.success{
  background:#16a34a;
}

.message.error{
  background:#dc2626;
}

.message.info{
  background:#2563eb;
}

.tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin-bottom:15px;
}

.tab{
  border:0;
  background:#e5e7eb;
  padding:10px 14px;
  border-radius:10px;
  white-space:nowrap;
  cursor:pointer;
}

.tab.active{
  background:#111827;
  color:white;
}

.booking{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.booking-title{
  font-weight:bold;
  font-size:17px;
  margin-bottom:7px;
}

.booking-info{
  font-size:14px;
  color:#4b5563;
  line-height:1.8;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:8px;
  font-size:12px;
  margin-top:7px;
}

.status.pending{
  background:#fef3c7;
  color:#92400e;
}

.status.confirmed{
  background:#dcfce7;
  color:#166534;
}

.status.done{
  background:#dbeafe;
  color:#1e40af;
}

.status.rejected,
.status.cancelled{
  background:#fee2e2;
  color:#991b1b;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px;
}

.actions button{
  width:auto;
  margin:0;
  padding:9px 12px;
  font-size:14px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.logout{
  text-align:center;
  margin-top:15px;
}

hr{
  border:0;
  border-top:1px solid #e5e7eb;
  margin:18px 0;
}

@media(max-width:450px){

  .time-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .row{
    grid-template-columns:1fr;
  }

}

</style>

<script>

/* =========================

const S={

/* =========================
   HELPERS
========================= */

function esc(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function toEn(value){

  return String(value??"")
    .replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
    .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));

}

function waNum(phone){

  let d=toEn(phone).replace(/\D/g,"");

  if(d.startsWith("00")){
    d=d.slice(2);
  }

  if(/^0\d{8,9}$/.test(d)){
    d="972"+d.slice(1);
  }

  if(/^9720\d{8,9}$/.test(d)){
    d="972"+d.slice(4);
  }

  return d;

}

function waLink(phone,text=""){

  const n=waNum(phone);

  if(!n) return "#";

  return "https://wa.me/"+n+
    (text ? "?text="+encodeURIComponent(text) : "");

}

function today(){

  return localDate(new Date());

}

function localDate(d){

  const y=d.getFullYear();

  const m=String(d.getMonth()+1).padStart(2,"0");

  const day=String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;

}

function dateObj(date){

  const p=date.split("-").map(Number);

  return new Date(p[0],p[1]-1,p[2]);

}

function addDays(date,n){

  const d=dateObj(date);

  d.setDate(d.getDate()+n);

  return localDate(d);

}

function formatDate(date){

  if(!date) return "";

  return dateObj(date).toLocaleDateString("ar-SA",{

    weekday:"long",

    year:"numeric",

    month:"long",

    day:"numeric"

  });

}

function shortDay(date){

  return dateObj(date).toLocaleDateString("ar-SA",{

    weekday:"short"

  });

}

function monthName(date){

  return dateObj(date).toLocaleDateString("ar-SA",{

    month:"short"

  });

}

function timeToMinutes(t){

  const p=t.split(":").map(Number);

  return p[0]*60+p[1];

}

function minutesToTime(m){

  const h=Math.floor(m/60);

  const min=m%60;

  return String(h).padStart(2,"0")+":"+
         String(min).padStart(2,"0");

}

function times(){

  const start=timeToMinutes(
    S.settings.start||"10:00"
  );

  const end=timeToMinutes(
    S.settings.end||"22:00"
  );

  const slot=Number(S.settings.slot)||60;

  const arr=[];

  for(let m=start;m<end;m+=slot){

    arr.push(minutesToTime(m));

  }

  return arr;

}

function isDayOff(date){

  return (S.settings.daysOff||[]).includes(date);

}

function full(date,time){

  const key=date+"_"+time;

  const taken=Number(
    S.availability[key]?.taken||0
  );

  const capacity=Number(
    S.settings.capacity||2
  );

  return taken>=capacity;

}

function message(text,type="info"){

  const el=document.getElementById("message");

  el.textContent=text;

  el.className="message show "+type;

  clearTimeout(window.messageTimer);

  window.messageTimer=setTimeout(()=>{

    el.className="message";

  },3500);

}


/* =========================
   HEADER
========================= */

function header(){

  return `

    <div class="header">

      <h1>
        ${esc(S.settings.name||"هيثم للحجامة")}
      </h1>

      <p>
        ${esc(S.settings.area||"أبو سنان")}
      </p>

    </div>

  `;

}


/* =========================
   HOME
========================= */

function renderHome(){

  if(!S.selectedDate){

    S.selectedDate=today();

  }

  const dates=[];

  for(let i=0;i<21;i++){

    dates.push(addDays(today(),i));

  }

  app.innerHTML=`

    <div class="container">

      ${header()}

      <div class="card">

        <h2>حجز موعد</h2>

        <div class="small"
             style="margin-bottom:12px">

          اختر اليوم

        </div>

        <div class="date-list">

          ${dates.map(d=>`

            <div

              class="date-item ${
                S.selectedDate===d?"active":""
              }"

              onclick="selectDate('${d}')"

            >

              <div class="date-day">
                ${esc(shortDay(d))}
              </div>

              <div class="date-number">
                ${dateObj(d).getDate()}
              </div>

              <div class="date-day">
                ${esc(monthName(d))}
              </div>

            </div>

          `).join("")}

        </div>

      </div>


      <div class="card">

        <h2>اختر الوقت</h2>

        ${
          isDayOff(S.selectedDate)

          ?

          `<div class="empty">
            هذا اليوم غير متاح للحجز
          </div>`

          :

          `

          <div class="time-grid">

            ${times().map(t=>{

              const isFull=
                full(S.selectedDate,t);

              return `

                <button

                  class="time-btn ${
                    S.selectedTime===t?"active":""
                  } ${
                    isFull?"disabled":""
                  }"

                  ${isFull?"disabled":""}

                  onclick="selectTime('${t}')"

                >

                  ${t}

                  ${
                    isFull
                    ?
                    `<div style="font-size:11px">
                      ممتلئ
                    </div>`
                    :
                    ""
                  }

                </button>

              `;

            }).join("")}

          </div>

          `
        }

      </div>


      ${
        S.selectedTime

        ?

        `

        <div class="card">

          <h2>بيانات الحجز</h2>

          <div class="small"
               style="margin-bottom:15px">

            ${esc(formatDate(S.selectedDate))}
            —
            ${esc(S.selectedTime)}

          </div>

          <div class="field">

            <label>الاسم</label>

            <input
              id="customerName"
              maxlength="80"
              placeholder="اكتب اسمك"
              autocomplete="name"
            >

          </div>

          <div class="field">

            <label>رقم الهاتف</label>

            <input
              id="customerPhone"
              type="tel"
              inputmode="tel"
              maxlength="20"
              placeholder="05XXXXXXXX"
              autocomplete="tel"
            >

          </div>

          <div class="field">

            <label>ملاحظات</label>

            <textarea
              id="customerNotes"
              maxlength="300"
              placeholder="أي ملاحظة"
            ></textarea>

          </div>

          <button
            class="btn btn-primary"
            onclick="createBooking()"
            type="button"
          >

            إرسال طلب الحجز

          </button>

        </div>

        `

        :

        ""

      }


      <div class="card">

        <h2>التواصل</h2>

        <p class="small">

          للحجز أو الاستفسار يمكنك التواصل معنا عبر واتساب.

        </p>

        ${
          S.settings.whatsapp

          ?

          `

          <a
            href="${waLink(S.settings.whatsapp)}"
            target="_blank"
            style="text-decoration:none"
          >

            <button
              class="btn btn-success"
              type="button"
            >

              التواصل عبر واتساب

            </button>

          </a>

          `

          :

          ""

        }

      </div>


      <div style="text-align:center">

        <button
          class="btn btn-secondary"
          style="width:auto"
          onclick="showLogin()"
          type="button"
        >

          دخول الإدارة

        </button>

      </div>

    </div>

  `;

}


/* =========================
   DATE
========================= */

function selectDate(date){

  S.selectedDate=date;

  S.selectedTime="";

  renderHome();

}


/* =========================
   TIME
========================= */

function selectTime(time){

  if(full(S.selectedDate,time)){

    message(
      "هذا الموعد ممتلئ",
      "error"
    );

    return;

  }

  S.selectedTime=time;

  renderHome();

}


/* =========================
   CREATE BOOKING
========================= */

async function createBooking(){

  const nameEl=
    document.getElementById("customerName");

  const phoneEl=
    document.getElementById("customerPhone");

  const notesEl=
    document.getElementById("customerNotes");


  if(!nameEl || !phoneEl){

    message(
      "تعذر قراءة بيانات الحجز",
      "error"
    );

    return;

  }


  const name=
    nameEl.value.trim();

  const phone=
    phoneEl.value.trim();

  const notes=
    notesEl ? notesEl.value.trim() : "";


  if(!name){

    message(
      "يرجى كتابة الاسم",
      "error"
    );

    return;

  }


  if(name.length<2){

    message(
      "الاسم قصير جدًا",
      "error"
    );

    return;

  }


  if(!phone){

    message(
      "يرجى كتابة رقم الهاتف",
      "error"
    );

    return;

  }


  if(phone.length<6){

    message(
      "يرجى إدخال رقم هاتف صحيح",
      "error"
    );

    return;

  }


  if(!S.selectedDate || !S.selectedTime){

    message(
      "يرجى اختيار التاريخ والوقت",
      "error"
    );

    return;

  }


  if(isDayOff(S.selectedDate)){

    message(
      "هذا اليوم غير متاح للحجز",
      "error"
    );

    return;

  }


  if(full(S.selectedDate,S.selectedTime)){

    message(
      "عذرًا، هذا الموعد أصبح ممتلئًا",
      "error"
    );

    return;

  }


  try{

    await db
      .collection("bookings")
      .add({

        name:name,

        phone:phone,

        date:S.selectedDate,

        time:S.selectedTime,

        notes:notes,

        status:"pending",

        createdAt:Date.now()

      });


    S.selectedTime="";

    renderHome();

    message(
      "تم إرسال طلب الحجز بنجاح ✅",
      "success"
    );


  }catch(error){

    console.error(
      "CREATE BOOKING ERROR:",
      error
    );

    message(
      "حدث خطأ أثناء إرسال الحجز",
      "error"
    );

  }

}


/* =========================
   LOGIN
========================= */

function showLogin(){

  app.innerHTML=`

    <div class="container">

      ${header()}

      <div class="card">

        <h2>دخول الإدارة</h2>

        <div class="field">

          <label>البريد الإلكتروني</label>

          <input
            id="loginEmail"
            type="email"
            placeholder="البريد الإلكتروني"
          >

        </div>

        <div class="field">

          <label>كلمة المرور</label>

          <input
            id="loginPassword"
            type="password"
            placeholder="كلمة المرور"
          >

        </div>

        <button
          class="btn btn-primary"
          onclick="login()"
          type="button"
        >

          دخول

        </button>

        <button
          class="btn btn-secondary"
          onclick="renderHome()"
          type="button"
        >

          العودة

        </button>

      </div>

    </div>

  `;

}


async function login(){

  const email=
    document.getElementById("loginEmail")
      .value.trim();

  const password=
    document.getElementById("loginPassword")
      .value;


  if(!email || !password){

    message(
      "أدخل البريد وكلمة المرور",
      "error"
    );

    return;

  }


  try{

    await auth.signInWithEmailAndPassword(
      email,
      password
    );

  }catch(error){

    console.error(error);

    message(
      "البريد الإلكتروني أو كلمة المرور غير صحيحة",
      "error"
    );

  }

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await auth.signOut();

}


/* =========================
   ADMIN
========================= */

function renderAdmin(){

  if(!S.user){

    renderHome();

    return;

  }


  app.innerHTML=`

    <div class="container">

      ${header()}

      <div class="card">

        <h2>لوحة الإدارة</h2>

        <div class="small">

          ${esc(S.user.email||"")}

        </div>

      </div>

      <div class="tabs">

        <button
          class="tab ${
            S.adminTab==="bookings"?"active":""
          }"
          onclick="setAdminTab('bookings')"
        >

          الحجوزات

        </button>

        <button
          class="tab ${
            S.adminTab==="manual"?"active":""
          }"
          onclick="setAdminTab('manual')"
        >

          حجز يدوي

        </button>

        <button
          class="tab ${
            S.adminTab==="settings"?"active":""
          }"
          onclick="setAdminTab('settings')"
        >

          الإعدادات

        </button>

      </div>

      <div id="adminContent"></div>

      <div class="logout">

        <button
          class="btn btn-secondary"
          onclick="logout()"
        >

          تسجيل الخروج

        </button>

      </div>

    </div>

  `;

  renderAdminContent();

}


function setAdminTab(tab){

  S.adminTab=tab;

  renderAdmin();

}


function renderAdminContent(){

  const el=
    document.getElementById("adminContent");

  if(!el) return;


  if(S.adminTab==="bookings"){

    renderBookings(el);

  }

  if(S.adminTab==="manual"){

    renderManual(el);

  }

  if(S.adminTab==="settings"){

    renderSettings(el);

  }

}


/* =========================
   BOOKINGS
========================= */

function renderBookings(el){

  const bookings=
    [...S.bookings].sort((a,b)=>{

      return (a.date+" "+a.time)
        .localeCompare(
          b.date+" "+b.time
        );

    });


  if(!bookings.length){

    el.innerHTML=`

      <div class="card">

        <div class="empty">

          لا توجد حجوزات حاليًا

        </div>

      </div>

    `;

    return;

  }


  el.innerHTML=`

    <div class="card">

      <h2>الحجوزات</h2>

      ${bookings.map(b=>bookingHTML(b)).join("")}

    </div>

  `;

}


function statusText(status){

  const map={

    pending:"بانتظار الموافقة",

    confirmed:"مؤكد",

    done:"تم",

    rejected:"مرفوض",

    cancelled:"ملغى"

  };

  return map[status]||status;

}


function bookingHTML(b){

  const msg=
    `مرحبًا ${b.name}، نؤكد لك موعد الحجامة بتاريخ ${b.date} الساعة ${b.time}.`;


  return `

    <div class="booking">

      <div class="booking-title">

        ${esc(b.name)}

      </div>

      <div class="booking-info">

        📅 ${esc(formatDate(b.date))}

        <br>

        🕐 ${esc(b.time)}

        <br>

        📞 ${esc(b.phone)}

        ${
          b.notes
          ?
          `<br>📝 ${esc(b.notes)}`
          :
          ""
        }

      </div>

      <div class="status ${esc(b.status)}">

        ${esc(statusText(b.status))}

      </div>

      <div class="actions">

        ${
          b.status==="pending"

          ?

          `

          <button
            class="btn btn-success"
            onclick="changeStatus('${b.id}','confirmed')"
          >

            قبول

          </button>

          <button
            class="btn btn-danger"
            onclick="changeStatus('${b.id}','rejected')"
          >

            رفض

          </button>

          `

          :

          ""

        }

        ${
          b.status==="confirmed"

          ?

          `

          <button
            class="btn btn-primary"
            onclick="changeStatus('${b.id}','done')"
          >

            تم الموعد

          </button>

          <button
            class="btn btn-warning"
            onclick="changeStatus('${b.id}','cancelled')"
          >

            إلغاء

          </button>

          `

          :

          ""

        }

        ${
          b.status==="done"

          ?

          `

          <button
            class="btn btn-primary"
            onclick="changeStatus('${b.id}','confirmed')"
          >

            إعادة تأكيد

          </button>

          `

          :

          ""

        }

        <a
          href="${waLink(b.phone,msg)}"
          target="_blank"
          style="text-decoration:none"
        >

          <button class="btn btn-success">

            واتساب

          </button>

        </a>

        ${
          b.status==="confirmed"

          ?

          `

          <button
            class="btn btn-secondary"
            onclick="addToGoogleCalendar('${b.id}')"
          >

            Google Calendar

          </button>

          `

          :

          ""

        }

        <button
          class="btn btn-danger"
          onclick="deleteBooking('${b.id}')"
        >

          حذف

        </button>

      </div>

    </div>

  `;

}


/* =========================
   STATUS
========================= */

async function changeStatus(id,status){

  try{

    await db
      .collection("bookings")
      .doc(id)
      .update({

        status:status,

        updatedAt:Date.now()

      });


    message(
      "تم تحديث حالة الحجز",
      "success"
    );

  }catch(error){

    console.error(error);

    message(
      "حدث خطأ أثناء تحديث الحجز",
      "error"
    );

  }

}


/* =========================
   DELETE
========================= */

async function deleteBooking(id){

  if(!confirm("هل تريد حذف هذا الحجز؟")){

    return;

  }


  try{

    await db
      .collection("bookings")
      .doc(id)
      .delete();


    message(
      "تم حذف الحجز",
      "success"
    );

  }catch(error){

    console.error(error);

    message(
      "تعذر حذف الحجز",
      "error"
    );

  }

}


/* =========================
   GOOGLE CALENDAR
========================= */

function addToGoogleCalendar(id){

  const b=
    S.bookings.find(x=>x.id===id);

  if(!b) return;


  const start=
    b.date.replace(/-/g,"")+
    "T"+
    b.time.replace(":","")+"00";


  const endMinutes=
    timeToMinutes(b.time)+
    (Number(S.settings.slot)||60);


  const endTime=
    minutesToTime(endMinutes);


  const end=
    b.date.replace(/-/g,"")+
    "T"+
    endTime.replace(":","")+"00";


  const url=
    "https://calendar.google.com/calendar/render?action=TEMPLATE"+
    "&text="+encodeURIComponent(
      "جلسة حجامة - "+b.name
    )+
    "&dates="+start+"/"+end+
    "&details="+encodeURIComponent(
      "جلسة حجامة\nرقم الهاتف: "+b.phone
    )+
    "&location="+encodeURIComponent(
      S.settings.area||"أبو سنان"
    );


  window.open(url,"_blank");

}


/* =========================
   MANUAL BOOKING
========================= */

function renderManual(el){

  if(!S.selectedDate){

    S.selectedDate=today();

  }


  el.innerHTML=`

    <div class="card">

      <h2>حجز يدوي</h2>

      <div class="field">

        <label>التاريخ</label>

        <input
          id="manualDate"
          type="date"
          value="${S.selectedDate}"
          min="${today()}"
          onchange="renderManualSlots()"
        >

      </div>

      <div id="manualSlots"></div>

      <div class="field">

        <label>اسم العميل</label>

        <input
          id="manualName"
          maxlength="80"
          placeholder="اسم العميل"
        >

      </div>

      <div class="field">

        <label>رقم الهاتف</label>

        <input
          id="manualPhone"
          maxlength="20"
          placeholder="05XXXXXXXX"
        >

      </div>

      <div class="field">

        <label>ملاحظات</label>

        <textarea
          id="manualNotes"
          maxlength="300"
        ></textarea>

      </div>

      <button
        class="btn btn-primary"
        onclick="createManualBooking()"
      >

        حفظ الحجز

      </button>

    </div>

  `;


  renderManualSlots();

}


function renderManualSlots(){

  const el=
    document.getElementById("manualSlots");

  if(!el) return;


  const date=
    document.getElementById("manualDate")?.value;


  if(!date){

    el.innerHTML="";

    return;

  }


  if(isDayOff(date)){

    el.innerHTML=`

      <div class="empty">

        هذا اليوم غير متاح

      </div>

    `;

    return;

  }


  el.innerHTML=`

    <div class="field">

      <label>الوقت</label>

      <select id="manualTime">

        ${times().map(t=>`

          <option
            value="${t}"
            ${full(date,t)?"disabled":""}
          >

            ${t}

            ${full(date,t)?" - ممتلئ":""}

          </option>

        `).join("")}

      </select>

    </div>

  `;

}


async function createManualBooking(){

  const date=
    document.getElementById("manualDate")?.value;

  const time=
    document.getElementById("manualTime")?.value;

  const name=
    document.getElementById("manualName")
      ?.value.trim();

  const phone=
    document.getElementById("manualPhone")
      ?.value.trim();

  const notes=
    document.getElementById("manualNotes")
      ?.value.trim();


  if(!date || !time || !name || !phone){

    message(
      "أكمل بيانات الحجز",
      "error"
    );

    return;

  }


  try{

    await db
      .collection("bookings")
      .add({

        name:name,

        phone:phone,

        date:date,

        time:time,

        notes:notes,

        status:"confirmed",

        createdAt:Date.now()

      });


    message(
      "تم حفظ الحجز اليدوي ✅",
      "success"
    );


    renderAdmin();

  }catch(error){

    console.error(error);

    message(
      "تعذر حفظ الحجز",
      "error"
    );

  }

}


/* =========================
   SETTINGS
========================= */

function renderSettings(el){

  el.innerHTML=`

    <div class="card">

      <h2>إعدادات المركز</h2>

      <div class="field">

        <label>اسم المركز</label>

        <input
          id="setName"
          value="${esc(S.settings.name)}"
        >

      </div>

      <div class="field">

        <label>المنطقة</label>

        <input
          id="setArea"
          value="${esc(S.settings.area)}"
        >

      </div>

      <div class="field">

        <label>واتساب</label>

        <input
          id="setWhatsApp"
          value="${esc(S.settings.whatsapp)}"
          placeholder="05XXXXXXXX"
        >

      </div>

      <div class="row">

        <div class="field">

          <label>بداية العمل</label>

          <input
            id="setStart"
            type="time"
            value="${esc(S.settings.start)}"
          >

        </div>

        <div class="field">

          <label>نهاية العمل</label>

          <input
            id="setEnd"
            type="time"
            value="${esc(S.settings.end)}"
          >

        </div>

      </div>

      <div class="row">

        <div class="field">

          <label>مدة الموعد بالدقائق</label>

          <input
            id="setSlot"
            type="number"
            value="${Number(S.settings.slot)||60}"
          >

        </div>

        <div class="field">

          <label>عدد الأشخاص لكل موعد</label>

          <input
            id="setCapacity"
            type="number"
            min="1"
            value="${Number(S.settings.capacity)||2}"
          >

        </div>

      </div>

      <button
        class="btn btn-primary"
        onclick="saveSettings()"
      >

        حفظ الإعدادات

      </button>

    </div>


    <div class="card">

      <h2>الأيام غير المتاحة</h2>

      <div class="field">

        <input
          id="dayOff"
          type="date"
          min="${today()}"
        >

      </div>

      <button
        class="btn btn-secondary"
        onclick="addDayOff()"
      >

        إضافة يوم غير متاح

      </button>

      <hr>

      ${
        (S.settings.daysOff||[]).length

        ?

        S.settings.daysOff.map(d=>`

          <div class="booking">

            ${esc(formatDate(d))}

            <button
              class="btn btn-danger"
              onclick="removeDayOff('${d}')"
            >

              حذف

            </button>

          </div>

        `).join("")

        :

        `<div class="empty">
          لا توجد أيام غير متاحة
        </div>`

      }

    </div>

  `;

}


async function saveSettings(){

  const data={

    name:
      document.getElementById("setName").value.trim(),

    area:
      document.getElementById("setArea").value.trim(),

    whatsapp:
      document.getElementById("setWhatsApp").value.trim(),

    start:
      document.getElementById("setStart").value,

    end:
      document.getElementById("setEnd").value,

    slot:
      Number(
        document.getElementById("setSlot").value
      )||60,

    capacity:
      Number(
        document.getElementById("setCapacity").value
      )||2,

    daysOff:
      S.settings.daysOff||[]

  };


  try{

    await db
      .collection("settings")
      .doc("main")
      .set(data,{merge:true});


    message(
      "تم حفظ الإعدادات ✅",
      "success"
    );

  }catch(error){

    console.error(error);

    message(
      "تعذر حفظ الإعدادات",
      "error"
    );

  }

}


/* =========================
   DAYS OFF
========================= */

async function addDayOff(){

  const date=
    document.getElementById("dayOff").value;


  if(!date){

    message(
      "اختر اليوم",
      "error"
    );

    return;

  }


  const days=
    [...(S.settings.daysOff||[])];


  if(!days.includes(date)){

    days.push(date);

  }


  try{

    await db
      .collection("settings")
      .doc("main")
      .set({

        daysOff:days

      },{merge:true});


    message(
      "تمت إضافة اليوم",
      "success"
    );

  }catch(error){

    console.error(error);

    message(
      "تعذر إضافة اليوم",
      "error"
    );

  }

}


async function removeDayOff(date){

  const days=
    (S.settings.daysOff||[])
      .filter(d=>d!==date);


  try{

    await db
      .collection("settings")
      .doc("main")
      .set({

        daysOff:days

      },{merge:true});


    message(
      "تم حذف اليوم",
      "success"
    );

  }catch(error){

    console.error(error);

    message(
      "تعذر حذف اليوم",
      "error"
    );

  }

}


/* =========================
   SETTINGS LISTENER
========================= */

db.collection("settings")
  .doc("main")
  .onSnapshot(

    doc=>{

      if(doc.exists){

        S.settings={

          ...S.settings,

          ...doc.data()

        };

      }


      /*
       لا نعيد رسم الصفحة إذا كان
       المستخدم قد اختار وقتًا وبدأ
       بإدخال بيانات الحجز.
      */

      if(
        S.view==="home" &&
        !S.selectedTime
      ){

        renderHome();

      }


      if(S.view==="admin"){

        renderAdmin();

      }

    },

    error=>{

      console.error(
        "Settings error:",
        error
      );

    }

  );


/* =========================
   AVAILABILITY LISTENER
========================= */

db.collection("settings")
  .doc("availability")
  .onSnapshot(

    doc=>{

      S.availability=
        doc.exists ? doc.data() : {};


      /*
       لا نمسح بيانات العميل
       أثناء تعبئة نموذج الحجز.
      */

      if(
        S.view==="home" &&
        !S.selectedTime
      ){

        renderHome();

      }

    },

    error=>{

      console.error(
        "Availability error:",
        error
      );

    }

  );


/* =========================
   BOOKINGS LISTENER
========================= */

function listenBookings(){

  db.collection("bookings")
    .onSnapshot(

      snapshot=>{

        S.bookings=
          snapshot.docs.map(doc=>({

            id:doc.id,

            ...doc.data()

          }));


        syncAvailability();


        if(S.view==="admin"){

          renderAdmin();

        }

      },

      error=>{

        console.error(
          "Bookings error:",
          error
        );

      }

    );

}


/* =========================
   AVAILABILITY SYNC
========================= */

async function syncAvailability(){

  if(!S.user) return;


  const counts={};


  S.bookings.forEach(b=>{

    if(
      b.status!=="confirmed" &&
      b.status!=="done"
    ){

      return;

    }


    const key=
      b.date+"_"+b.time;


    counts[key]=
      (counts[key]||0)+1;

  });


  const data={};


  Object.keys(counts).forEach(key=>{

    data[key]={

      taken:counts[key]

    };

  });


  try{

    await db
      .collection("settings")
      .doc("availability")
      .set(data);

  }catch(error){

    console.error(
      "Availability sync error:",
      error
    );

  }

}


/* =========================
   AUTH
========================= */

auth.onAuthStateChanged(user=>{

  S.user=user||null;


  if(user){

    S.view="admin";

    listenBookings();

    renderAdmin();

  }else{

    S.view="home";

    S.adminTab="bookings";

    renderHome();

  }

});


/* =========================
   START
========================= */

renderHome();

</script>
