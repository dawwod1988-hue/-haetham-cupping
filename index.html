<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>هيثم للحجامة</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7f8;
  color:#222;
}

.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 3px 15px rgba(0,0,0,.07);
}

h1{
  margin:0 0 5px;
  font-size:28px;
}

.subtitle{
  color:#777;
  margin-bottom:20px;
}

label{
  display:block;
  margin:12px 0 6px;
  font-weight:bold;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  background:white;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px;
}

.btn-primary{
  background:#111;
  color:white;
}

.btn-primary:active{
  transform:scale(.98);
}

.dates{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:5px;
}

.date-btn{
  min-width:72px;
  border:1px solid #ddd;
  background:white;
  border-radius:12px;
  padding:10px 5px;
  cursor:pointer;
}

.date-btn.active{
  background:#111;
  color:white;
}

.times{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.time-btn{
  padding:12px 5px;
  border:1px solid #ddd;
  background:white;
  border-radius:10px;
  cursor:pointer;
}

.time-btn.active{
  background:#111;
  color:white;
}

.time-btn.full{
  background:#eee;
  color:#999;
  cursor:not-allowed;
}

.message{
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  display:none;
}

.message.show{
  display:block;
}

.message.error{
  background:#ffe5e5;
  color:#a00000;
}

.message.success{
  background:#e4f8e8;
  color:#08752c;
}

.message.info{
  background:#e9f1ff;
  color:#174ea6;
}


/* BOOKING MODAL */

.booking-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:20px;
}

.booking-modal.show{
  display:flex;
}

.booking-modal-box{
  background:white;
  width:100%;
  max-width:380px;
  border-radius:20px;
  padding:30px 20px;
  text-align:center;
}

.booking-spinner{
  width:45px;
  height:45px;
  border:4px solid #ddd;
  border-top-color:#111;
  border-radius:50%;
  margin:0 auto 20px;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.booking-modal-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

.booking-modal-text{
  color:#777;
  line-height:1.6;
}

.booking-success{
  font-size:45px;
  margin-bottom:10px;
}

.booking-error{
  color:#b00020;
  line-height:1.6;
}

</style>
</head>


<body>


<!-- BOOKING MODAL -->

<div
  id="bookingModal"
  class="booking-modal"
>

  <div
    id="bookingModalBox"
    class="booking-modal-box"
  >

    <div
      id="bookingSpinner"
      class="booking-spinner"
    ></div>

    <div
      id="bookingModalTitle"
      class="booking-modal-title"
    >
      جاري إرسال الحجز...
    </div>

    <div
      id="bookingModalText"
      class="booking-modal-text"
    >
      يرجى الانتظار
    </div>

  </div>

</div>


<div class="container">

  <div id="message" class="message"></div>


  <div class="card">

    <h1 id="centerName">
      هيثم للحجامة
    </h1>

    <div
      id="centerArea"
      class="subtitle"
    >
      أبو سنان
    </div>

  </div>


  <div class="card">

    <h2>اختر التاريخ</h2>

    <div
      id="dates"
      class="dates"
    ></div>

  </div>


  <div class="card">

    <h2>اختر الوقت</h2>

    <div
      id="times"
      class="times"
    ></div>

  </div>


  <div class="card">

    <h2>بيانات الحجز</h2>


    <label>
      الاسم
    </label>

    <input
      id="customerName"
      type="text"
      placeholder="اكتب الاسم"
    >


    <label>
      رقم الهاتف
    </label>

    <input
      id="customerPhone"
      type="tel"
      placeholder="05XXXXXXXX"
    >


    <label>
      ملاحظات
    </label>

    <textarea
      id="customerNotes"
      placeholder="ملاحظات إضافية"
    ></textarea>


    <button
      class="btn btn-primary"
      type="button"
      onclick="createBooking()"
    >
      إرسال طلب الحجز
    </button>

  </div>

</div>


<script>


/* FIREBASE */

const firebaseConfig = {

  apiKey:
    "AIzaSyClhrm3BtsQhOOUe_Am9z69DkRAEwsweJ4",

  authDomain:
    "haetham-80b2a.firebaseapp.com",

  projectId:
    "haetham-80b2a",

  storageBucket:
    "haetham-80b2a.firebasestorage.app",

  messagingSenderId:
    "288982607003",

  appId:
    "1:288982607003:web:841f87f604b80b5745d23e",

  measurementId:
    "G-SSQSPWN5EX"

};


firebase.initializeApp(firebaseConfig);


const db =
  firebase.firestore();


const auth =
  firebase.auth();



/* APP STATE */

const S = {

  selectedDate:"",
  selectedTime:"",

  settings:{
    name:"هيثم للحجامة",
    area:"أبو سنان",
    whatsapp:"",
    start:"10:00",
    end:"22:00",
    slot:60,
    capacity:2,
    daysOff:[]
  },

  availability:{}

};



/* MESSAGE */

function message(text,type){

  const el =
    document.getElementById("message");

  if(!el) return;

  el.textContent = text;

  el.className =
    "message show " + (type || "info");

}


/* MODAL */

function showBookingModal(){

  const modal =
    document.getElementById("bookingModal");

  const spinner =
    document.getElementById("bookingSpinner");

  const title =
    document.getElementById("bookingModalTitle");

  const text =
    document.getElementById("bookingModalText");

  spinner.style.display =
    "block";

  title.textContent =
    "جاري إرسال الحجز...";

  text.textContent =
    "يرجى الانتظار";

  modal.classList.add("show");

}


function hideBookingModal(){

  const modal =
    document.getElementById("bookingModal");

  modal.classList.remove("show");

}


function bookingSuccess(){

  const spinner =
    document.getElementById("bookingSpinner");

  const title =
    document.getElementById("bookingModalTitle");

  const text =
    document.getElementById("bookingModalText");

  spinner.style.display =
    "none";

  title.textContent =
    "تم إرسال طلب الحجز";

  text.textContent =
    "سنقوم بتأكيد الموعد قريبًا.";

}


function bookingError(errorText){

  const spinner =
    document.getElementById("bookingSpinner");

  const title =
    document.getElementById("bookingModalTitle");

  const text =
    document.getElementById("bookingModalText");

  spinner.style.display =
    "none";

  title.textContent =
    "حدث خطأ";

  text.innerHTML =
    '<div class="booking-error">' +
    errorText +
    '</div>';

}



/* ENGLISH NUMBERS */

function toEn(value){

  return String(value)
    .replace(/[٠-٩]/g,function(d){

      return "٠١٢٣٤٥٦٧٨٩"
        .indexOf(d);

    });

}



/* ISRAEL WHATSAPP */

function waNum(p){

  let d =
    toEn(p)
    .replace(/\D/g,'');

  if(d.startsWith("00")){

    d =
      d.slice(2);

  }

  if(/^0\d{8,9}$/.test(d)){

    d =
      "972" + d.slice(1);

  }

  if(/^9720\d{8,9}$/.test(d)){

    d =
      "972" + d.slice(4);

  }

  return d;

}



/* DAY OFF */

function isDayOff(date){

  const days =
    S.settings.daysOff || [];

  return days.includes(date);

}



/* CHECK FULL */

function full(date,time){

  const key =
    date + "_" + time;

  const item =
    S.availability[key];

  if(!item) return false;

  const taken =
    Number(item.taken || 0);

  const capacity =
    Number(
      S.settings.capacity || 2
    );

  return taken >= capacity;

}



/* DATE HELPERS */

function pad(n){

  return String(n).padStart(2,"0");

}


function dateKey(date){

  return (
    date.getFullYear() +
    "-" +
    pad(date.getMonth()+1) +
    "-" +
    pad(date.getDate())
  );

}



/* RENDER HOME */

function renderHome(){

  const name =
    document.getElementById("centerName");

  const area =
    document.getElementById("centerArea");

  if(name){

    name.textContent =
      S.settings.name ||
      "هيثم للحجامة";

  }

  if(area){

    area.textContent =
      S.settings.area ||
      "أبو سنان";

  }


  renderDates();

  renderTimes();

}



/* DATES */

function renderDates(){

  const container =
    document.getElementById("dates");

  if(!container) return;

  container.innerHTML = "";

  const today =
    new Date();

  for(let i=0;i<21;i++){

    const d =
      new Date(today);

    d.setDate(
      today.getDate()+i
    );

    const key =
      dateKey(d);

    const btn =
      document.createElement("button");

    btn.className =
      "date-btn" +
      (
        S.selectedDate === key
        ? " active"
        : ""
      );

    const day =
      d.toLocaleDateString(
        "ar",
        {weekday:"short"}
      );

    const date =
      d.toLocaleDateString(
        "ar",
        {
          day:"numeric",
          month:"numeric"
        }
      );

    btn.innerHTML =
      "<strong>" +
      day +
      "</strong><br>" +
      date;

    btn.onclick =
      function(){

        selectDate(key);

      };

    container.appendChild(btn);

  }

}



/* SELECT DATE */

function selectDate(date){

  S.selectedDate =
    date;

  S.selectedTime =
    "";

  renderDates();

  renderTimes();

}



/* TIMES */

function renderTimes(){

  const container =
    document.getElementById("times");

  if(!container) return;

  container.innerHTML = "";


  if(!S.selectedDate){

    container.innerHTML =
      "<div>اختر التاريخ أولاً</div>";

    return;

  }


  const start =
    S.settings.start ||
    "10:00";

  const end =
    S.settings.end ||
    "22:00";

  const slot =
    Number(
      S.settings.slot || 60
    );


  let parts =
    start.split(":");

  let h =
    Number(parts[0]);

  let m =
    Number(parts[1]);


  const endParts =
    end.split(":");

  const endMinutes =
    Number(endParts[0])*60 +
    Number(endParts[1]);


  while(
    h*60+m < endMinutes
  ){

    const time =
      pad(h) + ":" + pad(m);

    const btn =
      document.createElement("button");

    const isFull =
      full(
        S.selectedDate,
        time
      );

    btn.className =
      "time-btn" +
      (
        S.selectedTime === time
        ? " active"
        : ""
      ) +
      (
        isFull
        ? " full"
        : ""
      );

    btn.textContent =
      isFull
      ? time + " ممتلئ"
      : time;

    if(!isFull){

      btn.onclick =
        function(){

          selectTime(time);

        };

    }else{

      btn.disabled = true;

    }

    container.appendChild(btn);

    m += slot;

    if(m >= 60){

      h += Math.floor(m/60);

      m =
        m % 60;

    }

  }

}



/* SELECT TIME */

function selectTime(time){

  S.selectedTime =
    time;

  renderTimes();

}



/* CREATE BOOKING */

async function createBooking(){

  const nameEl =
    document.getElementById(
      "customerName"
    );

  const phoneEl =
    document.getElementById(
      "customerPhone"
    );

  const notesEl =
    document.getElementById(
      "customerNotes"
    );


  if(
    !nameEl ||
    !phoneEl
  ){

    bookingError(
      "تعذر قراءة بيانات الحجز"
    );

    return;

  }


  const name =
    nameEl.value.trim();

  const phone =
    phoneEl.value.trim();

  const notes =
    notesEl
      ? notesEl.value.trim()
      : "";


  if(!name){

    bookingError(
      "يرجى كتابة الاسم"
    );

    return;

  }


  if(!phone){

    bookingError(
      "يرجى كتابة رقم الهاتف"
    );

    return;

  }


  if(!S.selectedDate){

    bookingError(
      "يرجى اختيار التاريخ"
    );

    return;

  }


  if(!S.selectedTime){

    bookingError(
      "يرجى اختيار الوقت"
    );

    return;

  }


  showBookingModal();


  try{

    console.log(
      "START FIRESTORE TEST"
    );


    const bookingData = {

      name:name,

      phone:phone,

      date:S.selectedDate,

      time:S.selectedTime,

      notes:notes,

      status:"pending",

      createdAt:Date.now()

    };


    console.log(
      "BOOKING DATA:",
      bookingData
    );


    /*
      مهم:
      إذا لم يستجب Firestore
      خلال 5 ثوانٍ سنظهر النتيجة
      بدل أن تبقى النافذة معلقة.
    */

    const testRef =
      await Promise.race([

        db
          .collection("bookings")
          .add(bookingData),

        new Promise(
          function(_,reject){

            setTimeout(
              function(){

                reject(
                  new Error(
                    "Firestore لم يستجب خلال 5 ثوانٍ"
                  )
                );

              },
              5000
            );

          }
        )

      ]);


    console.log(
      "BOOKING SAVED:",
      testRef.id
    );


    bookingSuccess();


    S.selectedTime =
      "";


    setTimeout(
      function(){

        hideBookingModal();

        renderHome();

      },
      2500
    );


  }

  catch(error){

    console.error(
      "FIRESTORE TEST ERROR:",
      error
    );


    bookingError(

      "النتيجة: " +
      (
        error.message ||
        error.code ||
        "خطأ غير معروف"
      )

    );

  }

}



/* FIREBASE SETTINGS */

db
  .collection("settings")
  .doc("main")
  .onSnapshot(

    function(doc){

      if(doc.exists){

        const data =
          doc.data();

        S.settings = {

          ...S.settings,

          ...data

        };

      }


      if(!S.selectedTime){

        renderHome();

      }

    },

    function(error){

      console.error(
        "SETTINGS ERROR:",
        error
      );

    }

  );



/* FIREBASE AVAILABILITY */

db
  .collection("settings")
  .doc("availability")
  .onSnapshot(

    function(doc){

      if(doc.exists){

        S.availability =
          doc.data() || {};

      }

      else{

        S.availability =
          {};

      }


      if(
        S.selectedDate &&
        !S.selectedTime
      ){

        renderTimes();

      }

    },

    function(error){

      console.error(
        "AVAILABILITY ERROR:",
        error
      );

    }

  );



/* START APP */

renderHome();


</script>

</body>
</html>
